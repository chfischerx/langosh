[project]
name = "langosh"
version = "0.1.0"
description = "A CLI to create, test, and deploy LangGraph agents"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    "questionary>=2.0",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.28.0",
    "openai>=1.40.0",
    "grandalf>=0.8",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]

[project.scripts]
langosh = "langosh.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langosh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
