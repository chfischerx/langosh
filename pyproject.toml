[project]
name = "langosh"
version = "0.1.1"
description = "A CLI to create, test, and deploy LangGraph agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christian Fischer" },
]
keywords = [
    "langgraph",
    "langchain",
    "langsmith",
    "cli",
    "agents",
    "llm",
    "ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx>=0.27.0",
    "questionary>=2.0",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-community>=0.3",
    "langchain-experimental>=0.3",
    "langchain-mcp-adapters>=0.2",
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.28.0",
    "openai>=1.40.0",
    "grandalf>=0.8",
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
langosh = "langosh.main:app"

[project.urls]
Homepage = "https://langosh.ai"
Repository = "https://github.com/chfischerx/langosh"
Documentation = "https://langosh.ai"
Issues = "https://github.com/chfischerx/langosh/issues"
Changelog = "https://github.com/chfischerx/langosh/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langosh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    # Treat deprecation warnings raised by our own code as errors;
    # ignore chatter from upstream libs we don't own.
    "error::DeprecationWarning:langosh.*",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# N806: local variables that carry type-like names (e.g. SystemMessage,
#   ContextSchema constructors assigned in functions) are idiomatic here.
# F541: f-strings without placeholders are cheap and keep the f-prefix
#   consistent across neighbouring log lines — not worth policing.
ignore = ["N806", "F541"]

[tool.ruff.lint.per-file-ignores]
# LLM-facing prose / tool descriptions routinely exceed 120 chars; line
# breaks inside them hurt readability without making anything safer.
"src/langosh/llm/prompts/*.py" = ["E501"]
"src/langosh/graphs/editor_tools.py" = ["E501"]
"src/langosh/graphs/tool_discovery.py" = ["E501"]
"src/langosh/llm/tools/*.py" = ["E501"]
"src/langosh/commands/*.py" = ["E501"]
"src/langosh/context.py" = ["E501"]
"src/langosh/modes/exec_.py" = ["E501"]
